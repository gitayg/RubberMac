name: Download Counts

# Once a day, records how many times each release file has been downloaded, on the stats branch
# (downloads.csv plus a README.md with the totals per day). GitHub keeps only running totals, so this is the history.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: download-counts

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stats
      - name: Record today's counts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        working-directory: stats
        run: |
          if git fetch --depth 1 origin stats; then
            git switch -C stats FETCH_HEAD
          else
            git switch --orphan stats
          fi
          ../main/downloads.sh --record .
          cat README.md >> "$GITHUB_STEP_SUMMARY"
          git add downloads.csv README.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Download counts $(date -u +%F)"
          git push origin HEAD:stats
